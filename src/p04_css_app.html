<style>
/* ============================================================
   DASHBOARD PREVIEW / APP CONSOLE / SIGNUP WIZARD /
   RESPONSIVE / REDUCED MOTION
   ============================================================ */
.dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}
.kpi{border-radius:14px;border:1px solid var(--line);padding:14px;background:linear-gradient(170deg,var(--t-40),var(--t-8))}
.kpi-lab{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4)}
.kpi-num{font-size:clamp(19px,2.2vw,26px);font-weight:620;letter-spacing:-.04em;margin-top:9px;font-variant-numeric:tabular-nums}
.kpi-delta{font-family:var(--mono);font-size:10px;letter-spacing:.06em;margin-top:7px;color:var(--ok)}
.kpi-delta.dn{color:var(--rose)}
.mini-spark{width:100%;height:22px;margin-top:10px;display:block}
.mini-spark polyline{fill:none;stroke:var(--cy);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.85}

.preview{border-radius:var(--r-xl);border:1px solid var(--line);overflow:hidden;background:linear-gradient(180deg,var(--t-30),rgba(2,4,7,.5))}
.preview-top{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(2,4,7,.5);flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{position:relative;height:34px;padding:0 14px;border-radius:9px;font-size:13.2px;color:var(--tx-3);transition:color var(--d-fast) ease,background var(--d-fast) ease}
.tab:hover{color:var(--tx-2);background:var(--glass)}
.tab.on{color:var(--tx);background:var(--glass-2)}
.tab.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1px;background:var(--grad-accent)}
.pv-meta{margin-left:auto;display:flex;align-items:center;gap:10px}
.panelwrap{position:relative;min-height:430px;padding:clamp(14px,2vw,22px)}
.panel-pane{position:absolute;inset:clamp(14px,2vw,22px);opacity:0;transform:translateY(12px) scale(.995);pointer-events:none;transition:opacity .42s var(--e-out),transform .52s var(--e-out)}
.panel-pane.on{opacity:1;transform:none;pointer-events:auto;position:relative;inset:auto}

.table{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.tr{display:grid;grid-template-columns:1.9fr .9fr .9fr .8fr .7fr;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.2px;transition:background var(--d-fast) ease}
.tr:last-child{border-bottom:0}
.tr.head{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);background:var(--t-20)}
.tr.row:hover{background:var(--t-28)}
.tr.row{opacity:0;transform:translateY(8px);animation:rowIn .6s var(--e-out) forwards}
@keyframes rowIn{to{opacity:1;transform:none}}
.co{display:flex;align-items:center;gap:10px;min-width:0}
.co b{font-weight:540;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--tx-2);width:fit-content}
.status.ok{color:#a9f4d5;border-color:rgba(70,227,164,.34);background:rgba(70,227,164,.07)}
.status.cy{color:#bff1ff;border-color:rgba(90,231,255,.3);background:rgba(90,231,255,.06)}
.status.amb{color:#ffdCA8;border-color:rgba(255,180,84,.3);background:rgba(255,180,84,.06)}
.status.vi{color:#cfc4ff;border-color:rgba(138,107,255,.3);background:rgba(138,107,255,.07)}
.bar{height:4px;border-radius:99px;background:var(--t-80);overflow:hidden;min-width:44px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--grad-accent);transition:width 1.1s var(--e-out)}
.bar.ok i{background:linear-gradient(90deg,#46e3a4,#5ae7ff)}
.two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;margin-top:14px}
.box{border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--t-14)}
.box h5{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);font-weight:500;margin:0}
.box .big{font-size:clamp(21px,2.6vw,30px);font-weight:620;letter-spacing:-.045em;margin-top:10px;font-variant-numeric:tabular-nums}
.logstream{display:grid;gap:8px;margin-top:12px;max-height:230px;overflow:hidden}
.chart-shell{position:relative;margin-top:12px;height:210px}
.chart-shell canvas{position:absolute;inset:0;width:100%;height:100%}
.gridlines{position:absolute;inset:0;background-image:linear-gradient(to bottom,var(--t-50) 1px,transparent 1px);background-size:100% 33.33%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4)}
.legend i{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--cy);margin-right:6px;vertical-align:2px}
.legend .v i{background:var(--vi)}

/* ---------- app console (route) ---------- */
.app{padding-top:66px;min-height:100vh;display:grid;grid-template-columns:230px 1fr}
.app-side{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:66px;height:calc(100vh - 66px);display:grid;align-content:start;gap:6px;background:var(--scrim-50);backdrop-filter:blur(12px)}
.app-side .sl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-4);padding:14px 10px 8px}
.app-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;font-size:13.6px;color:var(--tx-2);transition:background var(--d-fast) ease,color var(--d-fast) ease,transform var(--d-fast) var(--e-out);width:100%;text-align:left}
.app-item:hover{background:var(--glass);color:var(--tx);transform:translateX(2px)}
.app-item.on{background:linear-gradient(90deg,rgba(90,231,255,.12),rgba(90,231,255,.02));color:var(--tx);box-shadow:inset 1px 0 0 var(--cy)}
.app-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.app-item .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--tx-4)}
.app-main{padding:clamp(18px,2.4vw,30px);min-width:0}
.app-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.app-bar h2{font-size:clamp(20px,2.4vw,27px);font-weight:620;letter-spacing:-.035em}
.app-bar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.app-pane{display:none}
.app-pane.on{display:block;animation:paneIn .6s var(--e-out)}
@keyframes paneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- agent builder ---------- */
.builder{display:grid;grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);gap:clamp(18px,2.4vw,34px);align-items:start}
.agent-card{position:relative;border-radius:var(--r-lg);border:1px solid var(--line-2);padding:24px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 100% at 50% 0%,rgba(90,231,255,.12),rgba(138,107,255,.06) 46%,transparent 74%),var(--t-16)}
.orb{position:relative;width:132px;height:132px;margin:6px auto 20px;border-radius:50%;display:grid;place-items:center}
.orb i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(90,231,255,.3);animation:orbSpin 22s linear infinite}
.orb i:nth-child(2){inset:12px;border-color:rgba(138,107,255,.32);animation-duration:16s;animation-direction:reverse}
.orb i:nth-child(3){inset:24px;border-color:var(--t-140);animation-duration:11s}
.orb i::after{content:"";position:absolute;top:-2px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--cy);box-shadow:0 0 12px rgba(90,231,255,.9)}
@keyframes orbSpin{to{transform:rotate(360deg)}}
.orb-core{width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#bff4ff,#4fc9ff 34%,#3f7cff 62%,#5f43d6);box-shadow:0 0 60px -8px rgba(90,231,255,.7),inset 0 0 22px var(--t-320);transition:transform .5s var(--e-spring),box-shadow .5s ease,background .6s ease}
.orb.auto .orb-core{animation:breathe 2.1s ease-in-out infinite}
.orb.review .orb-core{animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.b-skills{display:grid;gap:9px;margin-top:18px;text-align:left}
.b-skill{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:1px solid var(--line);background:var(--t-16);font-size:13.2px;color:var(--tx-2);transition:opacity .4s ease,transform .5s var(--e-out),border-color .4s ease}
.b-skill.off{opacity:.34}
.b-skill .sw{width:30px;height:17px;border-radius:99px;background:var(--t-120);position:relative;margin-left:auto;flex:none;transition:background .3s ease}
.b-skill .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .34s var(--e-spring)}
.b-skill.on .sw{background:rgba(90,231,255,.5)}
.b-skill.on .sw::after{transform:translateX(13px)}
.ctrl{margin-top:22px}
.ctrl-lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);margin-bottom:11px}
.ctrl-lab b{color:var(--tx-2);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:linear-gradient(90deg,var(--cy) var(--p,50%),var(--t-120) var(--p,50%))}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--t-120)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#eafcff;margin-top:-6.5px;box-shadow:0 0 0 4px rgba(90,231,255,.18),0 4px 14px -2px rgba(90,231,255,.7);transition:box-shadow .25s ease,transform .25s var(--e-spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.16)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#eafcff;box-shadow:0 0 0 4px rgba(90,231,255,.18)}
.ctrl-val{font-family:var(--mono);font-size:11px;color:var(--cy);margin-top:6px;letter-spacing:.06em}
.txt{width:100%;height:44px;border-radius:11px;border:1px solid var(--line-2);background:var(--t-20);padding:0 13px;font-size:14.5px;letter-spacing:-.01em;transition:border-color var(--d-fast) ease,background var(--d-fast) ease,box-shadow var(--d-fast) ease}
.txt::placeholder{color:var(--tx-4)}
.txt:focus{outline:none;border-color:rgba(90,231,255,.5);background:rgba(90,231,255,.04);box-shadow:0 0 0 4px rgba(90,231,255,.09)}
.txt.pilltxt{border-radius:99px}

/* ---------- signup wizard overlay ---------- */
.sheet{position:fixed;inset:0;z-index:850;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
.sheet.on{opacity:1;visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(2,4,7,.76);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.sheet-in{
  position:relative;width:min(980px,100%);max-height:min(88vh,760px);display:grid;grid-template-columns:1.06fr .94fr;
  border-radius:var(--r-xl);border:1px solid var(--line-2);overflow:hidden;background:linear-gradient(168deg,#080b12,#05070b);
  box-shadow:0 60px 140px -40px rgba(0,0,0,.9);transform:translateY(24px) scale(.985);transition:transform .6s var(--e-out);
}
.sheet.on .sheet-in{transform:none}
.su-main{padding:clamp(20px,3vw,36px);display:grid;grid-template-rows:auto 1fr auto;gap:16px;min-width:0}
.su-top{display:flex;align-items:center;gap:12px}
.su-prog{flex:1;height:2px;border-radius:99px;background:var(--t-100);overflow:hidden}
.su-prog i{display:block;height:100%;width:20%;background:var(--grad-accent);transition:width .6s var(--e-out)}
.su-count{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--tx-4);flex:none}
.su-x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;transition:background var(--d-fast) ease,transform var(--d-fast) var(--e-out)}
.su-x:hover{background:var(--glass-2);transform:rotate(90deg)}
.su-viewport{position:relative;overflow:hidden}
.su-slide{position:absolute;inset:0;padding:2px;opacity:0;transform:translateX(38px);transition:opacity .42s var(--e-out),transform .58s var(--e-out);pointer-events:none;overflow-y:auto}
.su-slide.on{opacity:1;transform:none;pointer-events:auto;position:relative;inset:auto}
.su-slide.back{transform:translateX(-38px)}
.su-q{font-size:clamp(20px,2.7vw,30px);font-weight:620;letter-spacing:-.04em;line-height:1.14}
.su-hint{color:var(--tx-3);font-size:13.6px;margin-top:10px}
.su-opts{display:grid;gap:9px;margin-top:20px}
.su-opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--t-14);text-align:left;font-size:14px;transition:border-color var(--d-fast) ease,background var(--d-fast) ease,transform var(--d-fast) var(--e-out)}
.opt:hover{border-color:var(--line-2);background:var(--glass);transform:translateY(-1px)}
.opt.on{border-color:rgba(90,231,255,.5);background:rgba(90,231,255,.07);box-shadow:0 0 0 4px rgba(90,231,255,.06)}
.opt .k{width:26px;height:26px;border-radius:8px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;font-family:var(--mono);font-size:10px;color:var(--tx-3)}
.opt.on .k{border-color:rgba(90,231,255,.5);color:var(--cy)}
.opt .d{font-size:12.6px;color:var(--tx-4);margin-top:2px}
.opt .ck{margin-left:auto;opacity:0;transform:scale(.7);transition:opacity .3s ease,transform .4s var(--e-spring);stroke:var(--cy);fill:none;stroke-width:2.2;flex:none}
.opt.on .ck{opacity:1;transform:none}
.su-nav{display:flex;align-items:center;gap:12px}
.su-nav .btn{margin-left:auto}
.su-preview{border-left:1px solid var(--line);padding:clamp(20px,3vw,32px);background:radial-gradient(110% 100% at 100% 0%,rgba(90,231,255,.10),rgba(138,107,255,.06) 44%,transparent 76%),var(--t-12);display:grid;grid-template-rows:auto 1fr auto;gap:16px;min-width:0}
.su-prev-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx-4)}
.su-rows{display:grid;gap:11px;align-content:start}
.su-row{display:flex;align-items:baseline;gap:10px;font-size:13.4px;opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity .5s ease,transform .6s var(--e-out),filter .6s ease}
.su-row.on{opacity:1;transform:none;filter:blur(0)}
.su-row span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);flex:none;width:82px;padding-top:3px}
.su-row b{font-weight:520;letter-spacing:-.012em;color:var(--tx)}
.su-orb-thumb{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#bff4ff,#4fc9ff 34%,#3f7cff 62%,#5f43d6);box-shadow:0 0 46px -6px rgba(90,231,255,.7);margin-bottom:4px}
.su-done{display:grid;place-items:center;text-align:center;gap:14px;padding:clamp(18px,4vw,40px) 0}
.su-log{display:grid;gap:8px;text-align:left;width:min(420px,100%);margin-top:8px}

/* ---------- route transition wipe ---------- */
.wipe{position:fixed;inset:0;z-index:900;pointer-events:none;opacity:0;transform:scaleY(.6);transform-origin:top;
  background:linear-gradient(180deg,var(--scrim-96),var(--scrim-86));backdrop-filter:blur(8px);transition:opacity .42s var(--e-out),transform .5s var(--e-out)}
.wipe.on{opacity:1;transform:none}

/* ============================================================
   RESPONSIVE — mobile is not a shrunken desktop
   ============================================================ */
@media (max-width:1080px){
  .hero-grid{grid-template-columns:1fr;gap:44px}
  .live-body{min-height:340px}
  .core-wrap{grid-template-columns:1fr;gap:32px}
  .app{grid-template-columns:200px 1fr}
  .dash{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .nav-links{display:none}
  .nav-burger{display:grid}
  /* the action cluster is what overflows first: shed the duplicated console
     link, then tighten the CTA, then drop the inline language picker (the
     mobile sheet carries it) — the primary action always stays visible. */
  .nav-act [data-route="console"]{display:none}
  .nav-in{gap:12px}
  .nav-cta{padding:9px 13px;font-size:13px}
}
@media (max-width:640px){
  .lang-pick{display:none}
  .nav-cta .cta-full{display:none}
  .nav-cta .cta-short{display:inline}
  .nav-cta{padding:9px 12px}
  .brand-word{font-size:14.4px}
}
@media (max-width:420px){
  .nav-cta .ar{display:none}
  .brand small{display:none}
}
/* the ≤640px layout overrides below used to share one block with the nav rules
   above; the 420px block was inserted in the middle of it and left their opening
   brace behind, which is why they applied at every width. */
@media (max-width:640px){
  .story-inner{grid-template-columns:1fr;gap:22px;align-content:center}
  .story-title{min-height:0;font-size:clamp(22px,5.4vw,30px)}
  .story-desc{min-height:0;font-size:14.6px}
  .steps{margin-top:16px;grid-template-columns:1fr 1fr;gap:4px}
  .step:nth-child(n+7){display:none}
  .step{padding:6px 9px}
  .step-l{font-size:11.6px}
  .story-stage{height:min(48vh,400px)}
  .cards{grid-template-columns:1fr}
  .tiers{grid-template-columns:1fr}
  .tier.pop{order:-1}
  .f-grid{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .builder{grid-template-columns:1fr}
  .app{grid-template-columns:1fr}
  .app-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;display:flex;overflow-x:auto;gap:6px;padding:12px}
  .app-side .sl{display:none}
  .app-item{white-space:nowrap;width:auto}
  .app-item .cnt{display:none}
  .sheet-in{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}
  .su-preview{border-left:0;border-top:1px solid var(--line)}
  .tr{grid-template-columns:1.6fr .9fr .8fr;font-size:12.4px}
  .tr .hide-s{display:none}
  .quote{flex:0 0 100%}
  .core-legend{display:none}
  .f-big{font-size:clamp(34px,12.4vw,86px)}
}
@media (max-width:560px){
  .hero-stats{grid-template-columns:1fr}
  .stat{padding:16px 18px}
  .su-opts.two{grid-template-columns:1fr}
  .story-track{height:calc(7 * 100vh)}
  .story-stage{height:min(52vh,430px)}
  /* the research panel carries the most rows — let it scroll internally rather than clip */
  .panel[data-panel="1"] .panel-body{overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none;padding-right:2px}
  .panel[data-panel="1"] .panel-body::-webkit-scrollbar{display:none}
  .panel-body{gap:9px}
  .panel{padding:14px}
  .panel-body{margin-top:10px}
  .field{grid-template-columns:88px 1fr;gap:8px}
  .field-v{font-size:12.6px}
  .mail-body{font-size:12.6px;min-height:130px}
  .bars{height:80px}
  .f-grid{grid-template-columns:1fr}
  .dash{grid-template-columns:1fr}
  .cta-act .btn{width:100%;justify-content:center}
}

/* ============================================================
   REDUCED MOTION — complete static experience, no non-essential motion
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
html.reduced .bg-canvas,html.reduced .grain,html.reduced .cursor,html.reduced .story-hint{display:none}
html.reduced .grid-fx{animation:none}
html.reduced .atmo{animation:none;opacity:.42}
html.reduced .story-track{height:auto}
html.reduced .story-sticky{position:static;height:auto;padding-block:60px}
html.reduced .story-stage{height:auto;display:grid;gap:16px}
html.reduced .panel{position:static;opacity:1 !important;transform:none !important;filter:none !important;height:auto;min-height:0}
html.reduced .panel-body{height:auto}
html.reduced .steps{display:none}
html.reduced .story-prog{display:none}
html.reduced .section-aurora{display:none}
html.reduced [data-reveal]{opacity:1 !important;transform:none !important;filter:none !important;clip-path:none !important}
html.reduced .cine .line-in{opacity:1 !important;transform:none !important;filter:none !important}
html.reduced .btn-primary::after{display:none}
html.reduced .field,html.reduced .bubble,html.reduced .tr.row,html.reduced .su-row{opacity:1 !important;transform:none !important;filter:none !important}
