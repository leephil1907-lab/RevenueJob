<style>
/* ============================================================
   REVENUEPILOT OS — platform console
   Shell · Command Center · Supervisor · Approvals · Copilot ·
   Inbox · Intelligence · Revenue Intelligence · Marketplace ·
   Agency · Developers · Trust · Settings
   ============================================================ */
.os{--side:250px;min-height:100vh;padding-top:66px}
.os-shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);align-items:start}

/* ---------- rail ---------- */
.os-side{
  position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(7,10,16,.9),var(--scrim-75));
  backdrop-filter:blur(14px);padding:14px 12px 26px;display:grid;align-content:start;gap:2px;
  scrollbar-width:thin;
}
.os-side::-webkit-scrollbar{width:6px}
.os-side::-webkit-scrollbar-thumb{background:var(--t-100);border-radius:99px}
.ws-switch{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;
  border:1px solid var(--line);background:linear-gradient(150deg,var(--t-50),var(--t-12));
  text-align:left;transition:border-color var(--d-fast) ease,background var(--d-fast) ease;
}
.ws-switch:hover{border-color:var(--line-2);background:var(--glass-2)}
.ws-av{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:650;color:#04121a;background:linear-gradient(140deg,#bff4ff,#3f7cff)}
.ws-av.ag{background:linear-gradient(140deg,#e6d9ff,#8a6bff)}
.ws-t{min-width:0;flex:1}
.ws-t b{display:block;font-size:13px;font-weight:560;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-t span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx-4);margin-top:2px}
.ws-caret{color:var(--tx-4);font-size:10px}
.os-grp{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx-4);padding:18px 10px 8px}
.os-nav{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:10px;
  font-size:13.4px;color:var(--tx-2);text-align:left;
  transition:background var(--d-fast) ease,color var(--d-fast) ease,transform var(--d-fast) var(--e-out);
}
.os-nav:hover{background:var(--glass);color:var(--tx);transform:translateX(2px)}
.os-nav.on{background:linear-gradient(90deg,rgba(90,231,255,.13),rgba(90,231,255,.015));color:var(--tx);box-shadow:inset 1.5px 0 0 var(--cy)}
.os-nav svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.os-nav .n-badge{
  margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;padding:2px 6px;border-radius:99px;
  border:1px solid var(--line-2);color:var(--tx-3);
}
.os-nav .n-badge.hot{color:#bff1ff;border-color:rgba(90,231,255,.4);background:rgba(90,231,255,.1)}
.os-nav .n-badge.warn{color:#ffdCA8;border-color:rgba(255,180,84,.4);background:rgba(255,180,84,.1)}
.os-nav .n-badge.bad{color:#ffc3d0;border-color:rgba(255,107,139,.4);background:rgba(255,107,139,.1)}
.os-side-foot{margin-top:20px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--t-14)}
.os-side-foot h6{margin:0;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4)}
.os-side-foot .v{font-size:19px;font-weight:620;letter-spacing:-.04em;margin-top:8px;font-variant-numeric:tabular-nums}
.os-side-foot .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--tx-4);margin-top:4px}

/* ---------- top bar ---------- */
.os-main{min-width:0;padding:0 clamp(14px,2vw,26px) 60px}
.os-top{
  position:sticky;top:66px;z-index:40;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:16px 0 14px;background:linear-gradient(180deg,var(--scrim-94),var(--scrim-72) 70%,var(--scrim-0));
  backdrop-filter:blur(10px);
}
.os-top h2{font-size:clamp(19px,2.1vw,25px);font-weight:620;letter-spacing:-.035em}
.os-top .sub{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);margin-top:6px}
.os-top-act{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--tx-3);display:flex;align-items:center;gap:7px}
.clock b{color:var(--tx-2);font-weight:500}
.sel{
  height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--t-20);
  padding:0 8px;font-size:12.5px;letter-spacing:-.01em;color:var(--tx-2);cursor:pointer;
  transition:border-color var(--d-fast) ease,color var(--d-fast) ease;
}
.sel:hover{border-color:var(--line-3);color:var(--tx)}
.sel:focus{outline:none;border-color:rgba(90,231,255,.5)}
.kill{
  display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 15px;border-radius:11px;
  border:1px solid rgba(255,107,139,.45);background:linear-gradient(140deg,rgba(255,107,139,.14),rgba(255,107,139,.05));
  color:#ffd7e0;font-size:13px;font-weight:540;letter-spacing:-.01em;
  transition:background var(--d-base) var(--e-out),border-color var(--d-base) ease,box-shadow var(--d-base) var(--e-out),transform var(--d-fast) var(--e-out);
}
.kill:hover{background:linear-gradient(140deg,rgba(255,107,139,.24),rgba(255,107,139,.1));box-shadow:0 10px 34px -14px rgba(255,107,139,.7)}
.kill .led{width:7px;height:7px;border-radius:50%;background:#ff6b8b;box-shadow:0 0 0 0 rgba(255,107,139,.7);animation:pulse 2.2s var(--e-out) infinite}
body.os-paused .kill{border-color:rgba(70,227,164,.5);background:linear-gradient(140deg,rgba(70,227,164,.16),rgba(70,227,164,.05));color:#c6f7e4}
body.os-paused .kill .led{background:var(--ok);animation:none}

/* paused state: the whole OS goes visibly dormant */
.os-banner{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;margin-bottom:16px;
  border:1px solid rgba(255,107,139,.45);background:linear-gradient(120deg,rgba(255,107,139,.16),rgba(255,107,139,.05));
  box-shadow:0 20px 60px -40px rgba(255,107,139,.8);
}
.os-banner .t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.015em;color:#ffe4ea}
.os-banner .t span{display:block;font-size:12.6px;color:#ffc3d0;margin-top:3px}
.os-banner .acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.os-banner.ok{border-color:rgba(70,227,164,.4);background:linear-gradient(120deg,rgba(70,227,164,.14),rgba(70,227,164,.04))}
.os-banner.ok .t b{color:#d6fbee}
.os-banner.ok .t span{color:#a9f4d5}
body.os-paused .os-live{opacity:.45;filter:saturate(.5)}
body.os-paused [data-outbound]{opacity:.4;pointer-events:none;filter:grayscale(.5)}
.os-panes{display:block}
.os-pane{display:none}
.os-pane.on{display:block;animation:paneIn .52s var(--e-out)}

/* ---------- generic OS blocks ---------- */
.os-sec{margin-top:22px}
.os-h{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.os-h h3{font-size:16px;font-weight:600;letter-spacing:-.025em}
.os-h p{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4);margin-top:5px}
.os-h .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.split{display:grid;gap:14px}
.split.a{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.split.b{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.split.c{grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.panel-x{border:1px solid var(--line);border-radius:16px;background:linear-gradient(170deg,var(--t-36),var(--t-8));padding:16px}
.panel-x.pad{padding:18px}
.panel-x h4{font-size:13.5px;font-weight:560;letter-spacing:-.018em}
.panel-x .cap{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);margin-top:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:baseline;margin-top:12px;font-size:13.2px}
.kv dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4)}
.kv dd{margin:0;color:var(--tx);letter-spacing:-.01em}
.kv dd .hl{color:var(--cy)}
.tiny{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-4)}
.empty{padding:26px;text-align:center;color:var(--tx-4);font-size:13px}
.stars{display:inline-flex;gap:2px;color:#ffce6b;font-size:11px;letter-spacing:1px}
.toastwrap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:880;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:12px;
  border:1px solid var(--line-2);background:rgba(8,11,17,.94);backdrop-filter:blur(12px);
  font-size:13px;letter-spacing:-.01em;box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
  animation:toastIn .5s var(--e-out);max-width:min(520px,90vw);
}
.toast.ok{border-color:rgba(70,227,164,.45)}
.toast.warn{border-color:rgba(255,180,84,.45)}
.toast.bad{border-color:rgba(255,107,139,.45)}
.toast.out{animation:toastOut .4s var(--e-out) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.98)}}
.toast .ic{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;flex:none;background:rgba(90,231,255,.16);color:var(--cy);font-size:11px}

/* ---------- command center ---------- */
.cc-hero{
  position:relative;border-radius:18px;padding:20px;overflow:hidden;
  border:1px solid var(--line-2);
  background:radial-gradient(120% 120% at 100% 0%,rgba(90,231,255,.12),rgba(138,107,255,.06) 42%,transparent 72%),linear-gradient(170deg,var(--t-50),var(--t-12));
}
.cc-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cc-id{display:flex;align-items:center;gap:12px;min-width:0}
.cc-av{width:44px;height:44px;border-radius:14px;flex:none;background:radial-gradient(circle at 34% 28%,#bff4ff,#4fc9ff 34%,#3f7cff 62%,#5f43d6);box-shadow:0 0 34px -6px rgba(90,231,255,.7)}
.cc-id b{display:block;font-size:17px;font-weight:620;letter-spacing:-.03em}
.cc-id span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4);margin-top:3px}
.cc-live{
  display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border-radius:11px;
  border:1px solid rgba(90,231,255,.3);background:rgba(90,231,255,.07);font-size:12.6px;color:#dff8ff;
}
.cc-obj{margin-top:18px;padding-top:16px;border-top:1px dashed var(--t-90)}
.cc-obj .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx-4)}
.cc-obj .v{font-size:clamp(20px,2.4vw,28px);font-weight:620;letter-spacing:-.045em;margin-top:8px;font-variant-numeric:tabular-nums}
.cc-obj .r{font-size:13px;color:var(--tx-2);margin-top:8px;line-height:1.6}
.progline{height:4px;border-radius:99px;background:var(--t-80);overflow:hidden;margin-top:12px}
.progline i{display:block;height:100%;background:var(--grad-accent);width:0;transition:width 1.2s var(--e-out)}
.now-line{display:flex;align-items:center;gap:10px;font-size:13.4px;color:var(--tx-2);margin-top:12px}
.now-line .spin{width:13px;height:13px;border-radius:50%;border:1.6px solid rgba(90,231,255,.28);border-top-color:var(--cy);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.next-list{display:grid;gap:9px;margin-top:12px}
.next-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--t-14);font-size:13.2px}
.next-item .t{color:var(--tx);letter-spacing:-.012em}
.next-item .w{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-4);flex:none}
.agent-mini{
  display:grid;gap:10px;padding:13px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(168deg,var(--t-30),var(--t-6));
  transition:border-color var(--d-fast) ease,transform var(--d-fast) var(--e-out);
}
.agent-mini:hover{border-color:var(--line-2);transform:translateY(-2px)}
.agent-mini .h{display:flex;align-items:center;gap:10px}
.agent-mini .h b{font-size:13.6px;font-weight:560;letter-spacing:-.018em}
.agent-mini .h span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4)}
.agent-mini .st{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-3)}
.agent-mini .st i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.agent-mini .st.rev i{background:var(--amb)}
.agent-mini .st.off i{background:var(--tx-4)}
.agent-mini .task{font-size:12.6px;color:var(--tx-3);line-height:1.5;min-height:2.4em}
.agent-mini .m{display:flex;gap:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--tx-4)}
.agent-mini .m b{color:var(--tx-2);font-weight:500}
.donut{display:flex;align-items:center;gap:16px}
.donut .ring2{position:relative;width:96px;height:96px;flex:none}
.donut .ring2 svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ring2 circle{fill:none;stroke-width:8;stroke-linecap:round}
.donut .ring2 .bgc{stroke:var(--t-80)}
.donut .ring2 .fgc{stroke:url(#ringGrad)}
.donut .n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .n b{font-size:20px;font-weight:640;letter-spacing:-.04em;line-height:1}
.donut .n span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx-4)}

/* ---------- autonomy ladder + permissions ---------- */
.ladder{display:grid;gap:7px;margin-top:12px}
.rung{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;border:1px solid var(--line);
  background:var(--t-12);text-align:left;font-size:13.2px;color:var(--tx-3);
  transition:border-color var(--d-fast) ease,background var(--d-fast) ease,color var(--d-fast) ease,transform var(--d-fast) var(--e-out);
}
.rung:hover{border-color:var(--line-2);color:var(--tx-2);transform:translateX(2px)}
.rung .lvl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--tx-4);flex:none;width:22px}
.rung.on{border-color:rgba(90,231,255,.45);background:linear-gradient(90deg,rgba(90,231,255,.13),rgba(90,231,255,.02));color:var(--tx)}
.rung.on .lvl{color:var(--cy)}
.rung .desc{font-size:11.6px;color:var(--tx-4);margin-top:3px}
.rung .ck{margin-left:auto;stroke:var(--cy);fill:none;stroke-width:2.4;opacity:0;transition:opacity .3s ease;flex:none}
.rung.on .ck{opacity:1}
.perm{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.perm-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}
.perm-row:last-child{border-bottom:0}
.perm-row .nm{font-size:13.2px;letter-spacing:-.012em}
.perm-row .nm i{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx-4);font-style:normal;margin-top:3px}
.seg{display:flex;gap:2px;background:var(--t-30);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;min-width:64px;height:27px;border-radius:7px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx-4);transition:background var(--d-base) var(--e-out),color var(--d-base) ease;white-space:nowrap;
}
.seg button:hover{color:var(--tx-2)}
.seg button.on{background:linear-gradient(140deg,rgba(90,231,255,.9),rgba(63,124,255,.85));color:#04121a;font-weight:600}
.seg button.on.block{background:linear-gradient(140deg,rgba(255,107,139,.85),rgba(255,107,139,.6));color:#1a0308}
.seg.lock button.on{background:linear-gradient(140deg,rgba(255,180,84,.9),rgba(255,140,60,.8));color:#1a0d02}

/* ---------- supervisor ---------- */
.sup-stage{border:1px solid var(--line);border-radius:16px;background:radial-gradient(110% 90% at 50% 0%,rgba(138,107,255,.1),transparent 62%),var(--t-12);padding:14px}
.sup-svg{width:100%;height:auto;overflow:visible}
.sup-svg .lnk{fill:none;stroke:var(--t-120);stroke-width:1.2}
.sup-svg .lnk.on{stroke:url(#edgeGrad)}
.sup-svg .warnlnk{stroke:rgba(255,180,84,.5);stroke-dasharray:4 4}
.sup-node rect{fill:var(--t-40);stroke:var(--t-140);stroke-width:1;transition:fill .4s ease,stroke .4s ease}
.sup-node.warn rect{fill:rgba(255,180,84,.09);stroke:rgba(255,180,84,.45)}
.sup-node.hub rect{fill:rgba(138,107,255,.14);stroke:rgba(138,107,255,.5)}
.sup-node text{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;text-anchor:middle;dominant-baseline:middle;fill:#c9d4e3}
.sup-node .meta{font-size:8px;letter-spacing:1.2px;fill:#6a7688}
.interv{display:grid;gap:9px;margin-top:12px}
.iv{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 13px;border-radius:12px;
  border:1px solid var(--line);background:var(--t-14);
}
.iv.sev-high{border-color:rgba(255,107,139,.34);background:linear-gradient(100deg,rgba(255,107,139,.09),rgba(255,107,139,.015))}
.iv.sev-med{border-color:rgba(255,180,84,.32);background:linear-gradient(100deg,rgba(255,180,84,.08),rgba(255,180,84,.012))}
.iv.sev-info{border-color:rgba(90,231,255,.28);background:linear-gradient(100deg,rgba(90,231,255,.07),rgba(90,231,255,.012))}
.iv .ic2{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--t-50);border:1px solid var(--line)}
.iv .ic2 svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.iv.sev-high .ic2{color:#ff8fa6;border-color:rgba(255,107,139,.35)}
.iv.sev-med .ic2{color:#ffcf90;border-color:rgba(255,180,84,.35)}
.iv.sev-info .ic2{color:#a8ecff;border-color:rgba(90,231,255,.3)}
.iv b{display:block;font-size:13.4px;font-weight:550;letter-spacing:-.014em}
.iv p{font-size:12.4px;color:var(--tx-3);margin-top:4px;line-height:1.5}
.iv .acts{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- approvals ---------- */
.appr-counts{display:flex;gap:10px;flex-wrap:wrap}
.acount{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--t-14);font-size:12.8px}
.acount i{width:8px;height:8px;border-radius:50%;flex:none}
.acount.blue i{background:var(--cy)}.acount.amber i{background:var(--amb)}.acount.red i{background:var(--rose)}
.acount b{font-variant-numeric:tabular-nums}
.appr{display:grid;gap:13px;margin-top:14px}
.acard{
  border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;
  background:linear-gradient(168deg,var(--t-32),var(--t-8));
  transition:border-color var(--d-base) ease,opacity .4s ease,transform .4s var(--e-out);
}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--cy)}
.acard.amber::before{background:var(--amb)}
.acard.red::before{background:var(--rose)}
